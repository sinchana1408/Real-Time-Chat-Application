version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pulsechat-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pulsechat
    ports:
      - '5432:5432'
    volumes:
      - pulsechat_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pulsechat']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pulsechat_pg_data:
    driver: local
